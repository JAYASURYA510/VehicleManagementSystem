
<form [formGroup]="form" (ngSubmit)="save()">

  <div class="page-header">
    <div>
      <h2>Log Daily Expense & Trip Record</h2>
      <p class="subtitle">Enter vehicle trip and expense details</p>
    </div>
  </div>

  <div class="card">

    <div class="form-grid cols-2">
      <div class="form-group">
        <label>Select Vehicle <span class="required">*</span></label>
        <select formControlName="vehicleId">
          <option value="">-- Select a Vehicle --</option>

          @for (v of vehicles(); track v.id) {
            <option [value]="v.id">
              {{ v.registrationNumber }} — {{ v.driverName }}
            </option>
          }
        </select>
      </div>

      <div class="form-group">
        <label>Date <span class="required">*</span></label>
        <input type="date" formControlName="date" />
      </div>
    </div>

    <div class="section-title">
      Diesel Charges & Fueling
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Fuel Station Name</label>
        <input
          formControlName="fuelStation"
          placeholder="E.g. Shell Ring Road" />
      </div>

      <div class="form-group">
        <label>Diesel Litres Purchased</label>
        <input
          type="number"
          step="0.01"
          formControlName="dieselLitres" />
      </div>

      <div class="form-group">
        <label>Diesel Cost (₹)</label>
        <input
          type="number"
          step="0.01"
          formControlName="dieselCost" />
      </div>

      <div class="form-group">
        <label>From Odometer KM <span class="required">*</span></label>
        <input
          type="number"
          step="0.01"
          formControlName="fromKm"
          placeholder="Starting KM" />
      </div>

      <div class="form-group">
        <label>To Odometer KM <span class="required">*</span></label>
        <input
          type="number"
          step="0.01"
          formControlName="toKm"
          placeholder="Ending KM" />
      </div>

      <div class="form-group">
        <label>KM Before Fueling</label>
        <input
          type="number"
          step="0.01"
          formControlName="kmBeforeFueling"
          placeholder="Odometer before fill" />
      </div>

    </div>

    <div class="section-title">
      Other Operational Expenses (₹)
    </div>

    <div class="form-grid cols-4">

      <div class="form-group">
        <label>Toll Charges</label>
        <input
          type="number"
          step="0.01"
          formControlName="tollCharges" />
      </div>

      <!-- <div class="form-group">
        <label>Insurance Share</label>
        <input
          type="number"
          step="0.01"
          formControlName="insuranceShare" />
      </div> -->

      <div class="form-group">
        <label>Workshop Expenses</label>
        <input
          type="number"
          step="0.01"
          formControlName="workshopExpenses" />
      </div>

      <div class="form-group">
        <label>Tyre Maintenance</label>
        <input
          type="number"
          step="0.01"
          formControlName="tyreMaintenance" />
      </div>

    </div>

    <div class="form-grid cols-2">

      <div class="form-group">
        <label>Driver / Helper Salary</label>
        <input
          type="number"
          step="0.01"
          formControlName="driverSalary" />
      </div>

      <div class="form-group">
        <label>RTO Charges / Challan</label>
        <input
          type="number"
          step="0.01"
          formControlName="rtoCharges" />
      </div>

      <div class="form-group">
        <label>Trip Revenue (Returns)</label>
        <input
          type="number"
          step="0.01"
          formControlName="tripRevenue" />
      </div>

      <div class="form-group">
        <label>Notes</label>
        <input
          type="text"
          formControlName="notes"
          placeholder="Enter notes" />
      </div>

    </div>

    <div class="form-actions">
      <button
        type="reset"
        class="btn btn-outline">
         <i class="fa-solid fa-arrow-rotate-left"></i>
        Reset
      </button>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid">
        <i class="fa-solid fa-check"></i>
        Submit Record
      </button>
    </div>

  </div>

</form>
