<div class="page-container">
     <div class="page-header">
    <div>
      <h1>Super Admin List</h1>
      <p class="subtitle">List of Super Admins</p>
    </div>
  </div>

  <div class="card">
    <div class="table-responsive">
      <div class="mat-elevation-z2">
        <table mat-table [dataSource]="dataSource" class="custom-table" matSort>
          <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
          <td mat-cell *matCellDef="let user; let i = index">
            <strong>{{ i + 1 }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="customerId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer Id</th>
          <td mat-cell *matCellDef="let user">
            <strong>{{ user.customerId }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="customerName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer Name</th>
             <td mat-cell *matCellDef="let user">{{ user.customerName }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.emailId }}</td>
        </ng-container>

        <ng-container matColumnDef="phoneNo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
          <td mat-cell *matCellDef="let user">{{ user.phoneNo }}</td>
        </ng-container>

        <ng-container matColumnDef="view">
          <th mat-header-cell *matHeaderCellDef>View</th>
          <td mat-cell *matCellDef="let user">
            <div style="margin-bottom: 8px;"><a [routerLink]="['/superAdmin/NewonboardClient']" class="view-link">New Onboarding Customer</a></div>
            <div><a [routerLink]="['/superAdminList/onboardedClients']" class="view-link">Onboarded Customers</a></div>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let user" class="actions-cell">
            <div class="action-buttons">
              <button mat-icon-button class="action-button edit-button" title="Edit" aria-label="Edit user">
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
           <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </div>
  </div>
</div>
